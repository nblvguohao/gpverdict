[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpverdict"
version = "1.0.0"
description = "Decision-aligned evaluation of genomic prediction methods across environments"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Guohao Lv"}, {name = "Lichuan Gu"}]
dependencies = ["numpy>=1.22", "pandas>=1.4"]

[project.scripts]
gpverdict = "gpverdict.cli:main"

[tool.setuptools]
packages = ["gpverdict"]
